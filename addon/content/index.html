<!DOCTYPE html>
<html lang="">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title"></title>
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon@0.5x.png" />
  <link
    href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Open+Sans:wght@400;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles/index.css" />
</head>

<body data-theme="light">
  <div class="main-layout">
    <!-- 左侧边栏 - 功能区 -->
    <aside class="sidebar-left">
      <div class="sidebar-header">
        <div class="sidebar-top-controls">
          <div class="theme-selector-wrapper">
            <label for="theme-selector" id="label-theme-selector"></label>
            <select id="theme-selector" class="theme-selector">
              <option value="light" id="theme-option-light"></option>
              <option value="dark" id="theme-option-dark"></option>
              <option value="beige" id="theme-option-beige"></option>
              <option value="green" id="theme-option-green"></option>
            </select>
          </div>
          <button id="refresh-btn" class="refresh-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 4v6h-6"></path>
              <path d="M1 20v-6h6"></path>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
            <span id="refresh-btn-text"></span>
          </button>
        </div>
      </div>

      <div class="sidebar-content">
        <!-- 文件夹过滤 -->
        <div class="sidebar-section">
          <label id="label-collection-filter" class="section-title"></label>
          <div class="collections-dropdown">
            <button id="collections-trigger" class="collections-trigger"></button>
            <div id="collections-panel" class="collections-panel">
              <div id="collections-tree" class="collections-tree"></div>
            </div>
          </div>
        </div>

        <!-- 搜索过滤 -->
        <div class="sidebar-section">
          <div class="control-group">
            <label for="text-search" id="label-text-search"></label>
            <div class="search-input-wrapper">
              <input type="text" id="text-search" placeholder="" />
              <button type="button" id="text-regex-toggle" class="regex-toggle" title="">R</button>
            </div>
          </div>
          <div class="control-group">
            <label for="comment-search" id="label-comment-search"></label>
            <div class="search-input-wrapper">
              <input type="text" id="comment-search" placeholder="" />
              <button type="button" id="comment-regex-toggle" class="regex-toggle" title="">R</button>
            </div>
          </div>
        </div>

        <!-- 显示设置 -->
        <div class="sidebar-section">
          <div class="control-group">
            <label for="items-per-row" id="label-items-per-row"></label>
            <input type="number" id="items-per-row" min="1" max="3" value="1" />
          </div>
          <div class="control-group">
            <label for="items-per-page" id="label-items-per-page"></label>
            <select id="items-per-page">
              <option value="50">50</option>
              <option value="100">100</option>
              <option value="200">200</option>
            </select>
          </div>
          <div class="control-group">
            <label for="date-preset" id="label-date-preset"></label>
            <select id="date-preset">
              <option value="all" id="date-preset-all"></option>
              <option value="1" id="date-preset-1"></option>
              <option value="3" id="date-preset-3"></option>
              <option value="7" id="date-preset-7"></option>
              <option value="30" id="date-preset-30"></option>
              <option value="365" id="date-preset-365"></option>
              <option value="custom" id="date-preset-custom" disabled hidden></option>
            </select>
          </div>
        </div>

        <!-- 颜色过滤 -->
        <div class="sidebar-section">
          <div class="filter-header">
            <h3 class="section-title" id="label-color-filter"></h3>
            <select id="color-op" class="filter-op-select">
              <option value="OR">OR</option>
              <option value="AND">AND</option>
              <option value="NOT">NOT</option>
            </select>
          </div>
          <div class="colors-list" id="colors-list"></div>
        </div>

        <!-- 标签过滤 -->
        <div class="sidebar-section">
          <div class="filter-header">
            <h3 class="section-title" id="label-tag-filter"></h3>
            <select id="tag-op" class="filter-op-select">
              <option value="OR">OR</option>
              <option value="AND">AND</option>
              <option value="NOT">NOT</option>
            </select>
          </div>
          <div class="tags-list" id="tags-list"></div>
        </div>
      </div>
    </aside>

    <!-- 右侧主内容区 -->
    <main class="content-right">
      <div class="content-wrapper">
        <!-- 显示计数与导出操作栏 -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
          <div id="display-count"></div>
          <button id="export-btn" class="export-btn"
            style="padding: 8px 16px; border-radius: 6px; background: var(--secondary-color); color: #fff; border: none; font-weight: 600; cursor: pointer; transition: background 0.2s;">Export
            JSON</button>
        </div>
        <!-- 注释容器 -->
        <div id="annotation-container"></div>

        <!-- 无结果提示 -->
        <div id="no-results" style="display: none;"></div>

        <!-- 批量添加标签 -->
        <div id="batch-add-tag-bar" style="margin: 24px 0 0 0; display: flex; align-items: center; gap: 12px;">
          <div style="position: relative; flex: 1;">
            <input id="batch-tag-input" type="text" placeholder="输入标签"
              style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc;" autocomplete="off" />
            <div id="batch-tag-suggestions"
              style="position: absolute; left: 0; right: 0; top: 100%; background: #fff; border: 1px solid #e1e5eb; border-radius: 0 0 6px 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); z-index: 10; display: none;">
            </div>
          </div>
          <button id="batch-add-tag-btn"
            style="padding: 10px 18px; border-radius: 6px; background: var(--secondary-color); color: #fff; border: none; font-weight: 600; cursor: pointer;">添加标签</button>
        </div>

        <!-- 分页导航 -->
        <div id="pagination-container">
          <button id="prev-page"></button>
          <span id="page-info"></span>
          <button id="next-page"></button>
        </div>

        <!-- 统计区域 -->
        <div class="stats-container">
          <h2 id="stats-title"></h2>
          <div class="stats-grid">
            <div class="stats-box">
              <h3 id="stats-color"></h3>
              <div id="color-histogram"></div>
            </div>
            <div class="stats-box">
              <h3 id="stats-tag"></h3>
              <div id="tag-histogram"></div>
            </div>
          </div>
          <div id="heatmap-stats-box" class="stats-box" style="margin-top: 20px;">
            <h3 id="stats-heatmap"></h3>
            <div id="study-heatmap" class="heatmap-container"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="global-tooltip" class="global-tooltip"></div>
  <!-- 导出字段选择弹窗 (Modal) -->
  <div id="export-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h3
        style="margin-bottom: 16px; color: var(--text-primary); border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">
        Export Fields</h3>
      <div id="export-fields" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px;">
        <label><input type="checkbox" value="text" checked> Annotation Text</label>
        <label><input type="checkbox" value="comment" checked> Comment</label>
        <label><input type="checkbox" value="color" checked> Color</label>
        <label><input type="checkbox" value="tags" checked> Tags</label>
        <label><input type="checkbox" value="sourceTitle" checked> Item Title</label>
        <label><input type="checkbox" value="authorSummary" checked> Author</label>
        <label><input type="checkbox" value="year" checked> Year</label>
        <label><input type="checkbox" value="publicationTitle" checked> Publication</label>
        <label><input type="checkbox" value="extra" checked> Citation Key / Extra</label>
        <label><input type="checkbox" value="dateAdded" checked> Date Added</label>
        <label><input type="checkbox" value="uri" checked> URI Link</label>
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 12px;">
        <button id="export-cancel-btn"
          style="padding: 8px 16px; border-radius: 6px; background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border-color); cursor: pointer;">Cancel</button>
        <button id="export-confirm-btn"
          style="padding: 8px 16px; border-radius: 6px; background: var(--secondary-color); color: #fff; border: none; font-weight: 600; cursor: pointer;">Export</button>
      </div>
    </div>
  </div>

  <script src="scripts/summary-ui.js"></script>
</body>

</html>
